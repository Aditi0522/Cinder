[project]
name = "cinder-harness"
version = "0.1.0"
description = "Reproducible Lean proof evaluation for Cinder"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cinder = "harness.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires the pinned Lean toolchain and resource-limited Linux sandbox",
  "mathlib: requires the pinned miniF2F/Mathlib environment",
]

[tool.ruff]
target-version = "py311"
line-length = 100
